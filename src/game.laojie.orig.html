function play8(th,s,t){const e=30/{inv:INV,test:TST,final:FIN}[th].bpm;
 if(th==='inv'){const ch=INV.chords[Math.floor(s/16)%4];// guitar arpeggio

async function cx0(who,title,r){
 let i=0;setBGM(S.flags.final?'final':'test');
 await N(`—— ${title} ——\n（點「追問」逼問細節，發現矛盾就按「出示」證物！卡關可按「💡 提示」，或「✖ 離開」先去調查。）`);
 {const h=missHint(r);if(h)await N(h)}
 while(true){
  const L=r.lines[i];
  hideBox();tban(r,title,i);por.classList.remove('zoom');
  await say(who,`「${L.t}」`,L.e||'normal',{test:true,noWait:true,chip:`證言 ${i+1}/${r.lines.length}${(r._p||{})[i]?' ✓':''}`});
  const tb=$('#tbar');
  const v=await new Promise(res=>{tb.innerHTML='';tb.style.display='flex';tb.style.bottom=(box.offsetHeight+18)+'px';
   let done=false;[['◀ 上一句','prev'],['🔍 追問','press'],['📒 出示','present','red'],['下一句 ▶','next'],[`💡 提示${r._h>=2?'（已全開）':r._h?'（再一次）':''}`,'hint','r2 hint'],[S.flags.final?'✖ 先撤退（保留心數）':'✖ 離開，先去調查','leave','r2 leave']].forEach(([l,val,c])=>{const x=document.createElement('button');x.type='button';x.className='btn '+(c||'');x.dataset.act=val;x.style.minWidth='0';x.style.flex=1;x.style.padding='14px 2px';x.style.fontSize='15px';x.textContent=l;x.dataset.v=val;onTap(x,()=>{if(done)return;done=true;ac();SFX.tap();tb.style.display='none';res(val)});tb.appendChild(x)})});
  if(v==='leave'){hideBox();setPor(null);await N(S.flags.final?'（先撤退整理線索。心數會保留，準備好再按「⚖️ 指認兇手」繼續對質。）':`（先離開，晚點再找${CH[who]}談。）`);return 'leave'}
  if(v==='hint'){await useHint(r);continue}
  if(v==='prev'){i=(i-1+r.lines.length)%r.lines.length;continue}
  if(v==='next'){i++;if(i>=r.lines.length){i=0;await N('（證詞又繞回第一句了。哪一句跟證物對不上？）')}continue}

  if(v==='present'){busyModal=true;const k=await evModal('要出示哪一個證物？',true);busyModal=false;if(!k)continue;
   if(i===r.answer.i&&r.answer.ev.includes(k)){await epHit(who,k,L,!!S.flags.final&&/4\/4/.test(title));return k}
   S.miss++;await epMiss(who,!!S.flags.final);
   await say(who,r.wrongLine||'……你拿這個出來是想說什麼？跟我說的話根本沒有矛盾啊。','normal');
   if(S.flags.final){if(S.hearts<=0)return 'dead';await N(`（判斷失誤，信用剩下 ${S.hearts} 顆心……）`)}
   else await N(missHint(r)||'（好像不對……再看看證詞跟證物哪裡對不上。卡住可以按「💡 提示」。）');
  }
 }

async function prologue(){
 setBg('street','brightness(.6)');setBGM('inv');
 await N('—— 序章 ——\n颱風來的前一天，台北。');
 setPor('me','point');await say('me','我叫許晴，在台北開了一間小小的偵探事務所。專長是找人、找東西，還有找出謊話。');
 await N('那天，事務所收到一封手寫信。寄件人是山城老街「福記」糕餅店的阿福伯——小時候，阿嬤每次帶我回老街，都會買他做的芋粿。');
 await N('阿嬤以前也在這條老街開過一間雜貨店。我國中那年，她被人逼著把店賣掉，搬到台北以後，就再也沒回來過。');
 await say('fu','（信）小晴，最近一直有人來店裡逼我賣掉福記，還說些奇怪的話。阿伯心裡不安，妳能回來一趟嗎？');
 setPor('me','point');await say('me','我搭了最後一班客運上山，住進老街口的民宿。打算明天一早，就去福記找阿伯問清楚。');
 setPor(null);await N('可是那天晚上，颱風提早登陸了。\n我還來不及見到阿伯——');
}
/* ---------- intro ---------- */
async function intro(){
 $('#title').style.display='none';await prologue();await chapter('第一章<br>颱風夜');
 setBg('street');SFX.thunder();
 await N('颱風夜，山城老街。晚上八點四十分，整條街突然停電。');
 await N('九點半，百年糕餅店「福記」的老闆阿福伯，被發現倒在後面的倉庫裡。\n手裡，緊緊握著一塊吃到一半的芋粿。');
 await say('doc','（電話）阿福伯驗出了大量安眠藥，正在昏睡。幸好發現得早，沒有生命危險。');
 await getEv('hosp');
 await say('me','我是偵探許晴。阿伯找我來，就是怕出事……雨停之前，所有人都下不了山——兇手，就在這條街上。');
 await N('🔍 點畫面上發光的地方調查；用下方按鈕跟人說話。\n📒 證物隨時可以在右上角查看；證詞卡關可以按「💡 提示」。');
 S.scene='street';
}
const SKEY='laojie';
/* ---------- save / load ---------- */
const SAVE_V=2;let lastSnap=null;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SLOTS=['auto','s1','s2','s3'],skey=s=>SKEY+'_'+s;
function chapName(){return S.flags.final?'最終對質':S.flags.ch2?'第二章':'第一章'}
function snapshot(){if(S.ended||!S.scene||!SC[S.scene])return;
 const H={};if(typeof T!=='undefined')for(const k in T)if(T[k]&&T[k]._h)H[k]=T[k]._h;
 lastSnap={v:SAVE_V,t:Date.now(),chap:chapName(),place:SC[S.scene].name,evn:S.ev.length,hearts:S.hearts,bgm:bgmOn,H,S:JSON.parse(JSON.stringify(S))};
 LS.set(skey('auto'),JSON.stringify(lastSnap))}
function readSlot(s){try{const d=JSON.parse(LS.get(skey(s)));if(!d||d.v!==SAVE_V||!d.S||!Array.isArray(d.S.ev)||!SC[d.S.scene]||typeof d.S.flags!=='object')return null;return d}catch(e){return null}}
const latest=()=>SLOTS.map(readSlot).filter(Boolean).sort((a,b)=>b.t-a.t)[0]||null;
const fmtT=t=>new Date(t).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'（台北）';
function applySave(d){for(const k of Object.keys(S))delete S[k];Object.assign(S,JSON.parse(JSON.stringify(d.S)));S.ended=false;
 if(typeof T!=='undefined')for(const k in T)if(T[k])T[k]._h=(d.H||{})[k]||0;
 if(typeof d.bgm==='boolean'&&d.bgm!==bgmOn){bgmOn=d.bgm;LS.set(SKEY+'_bgm',bgmOn?'on':'off');if(MB&&AC)MB.gain.value=bgmOn?1:0}
 $('#bgmBtn').textContent=bgmOn?'♪ 開':'♪ 關';$('#evBtn').style.display=S.ev.length?'':'none';
 $('#title').style.display='none';$('#menuBtn').style.display='';closeSv();hearts();setBg(SC[S.scene].bg);window.__fast=window.__fast||false;renderScene()}
function doLoad(d){if(started){LS.set(SKEY+'_pending',JSON.stringify(d));location.reload()}else{try{ac()}catch(e){}started=true;applySave(d)}}
let started=false;
/* overlay UI */
const sv=document.createElement('div');sv.id='sv';document.getElementById('app').appendChild(sv);
const st=document.createElement('style');st.textContent=`#sv{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.88);display:none;flex-direction:column;justify-content:center;padding:18px;gap:10px}
#sv h2{color:#f5c26b;text-align:center;margin:0 0 6px}#sv .slot{background:#1d2440;border:2px solid #f5c26b;border-radius:12px;color:#fff;padding:10px 12px;text-align:left;font-size:14px;line-height:1.5}
#sv .slot b{color:#f5c26b}#sv .slot.empty{opacity:.6}#sv .note{color:#aaa;font-size:12px;text-align:center}#sv .btn{flex:none}
#menuPop{position:absolute;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 40px);z-index:25;display:none;flex-direction:column;gap:6px;background:#0d1226ee;border:2px solid #f5c26b;border-radius:12px;padding:8px}
#menuPop .hb{margin:0;font-size:14px;padding:8px 14px;background:#2a3a6a;text-align:left}`;document.head.appendChild(st);
function closeSv(){sv.style.display='none';sv.innerHTML=''}
function ask(msg){return new Promise(r=>{sv.innerHTML=`<h2>確認</h2><div class="note" style="color:#fff;font-size:16px">${msg}</div>`;const y=document.createElement('button');y.className='btn red';y.id='svYes';y.textContent='確定';const n=document.createElement('button');n.className='btn';n.id='svNo';n.textContent='取消';y.onclick=()=>{closeSv();r(true)};n.onclick=()=>{closeSv();r(false)};sv.append(y,n);sv.style.display='flex'})}
function slotHtml(s,d){const nm=s==='auto'?'自動存檔':'存檔 '+s[1];return d?`<b>${nm}</b>　${fmtT(d.t)}<br>${d.chap}・${d.place}<br>📒 證物 ${d.evn}　❤️ ${d.hearts}/5`:`<b>${nm}</b>　（空）`}
function openSv(mode){sv.innerHTML=`<h2>${mode==='save'?'💾 存檔':'📂 讀檔'}</h2>`;
 (mode==='save'?SLOTS.slice(1):SLOTS).forEach(s=>{const d=readSlot(s),b=document.createElement('button');b.className='slot'+(d?'':' empty');b.dataset.slot=s;b.innerHTML=slotHtml(s,d);
  b.onclick=async()=>{if(mode==='save'){if(!lastSnap)return;if(d&&!(await ask(`覆蓋「存檔 ${s[1]}」？`)))return openSv('save');const o={...lastSnap,t:Date.now()};const ok=LS.set(skey(s),JSON.stringify(o));openSv('save');if(!ok)sv.querySelector('h2').textContent='⚠️ 無法存檔（私密瀏覽？）'}else if(d)doLoad(d)};sv.appendChild(b)});
 const n=document.createElement('div');n.className='note';n.textContent=mode==='save'?'會記錄最近一次回到場景畫面時的進度。':'讀檔會回到該存檔的場景畫面。';sv.appendChild(n);
 const c=document.createElement('button');c.className='btn';c.id='svClose';c.textContent='關閉';c.onclick=()=>{closeSv();refreshTitle()};sv.appendChild(c);sv.style.display='flex'}
/* ☰ menu */
(()=>{const lb=$('#logBtn'),bb=$('#bgmBtn'),m=document.createElement('button');m.className='hb';m.id='menuBtn';m.style.background='#2a3a6a';m.textContent='☰ 選單';lb.parentNode.insertBefore(m,lb);
 const p=document.createElement('div');p.id='menuPop';document.getElementById('app').appendChild(p);
 const sb=document.createElement('button');sb.className='hb';sb.id='saveBtn';sb.textContent='💾 存檔';const ldb=document.createElement('button');ldb.className='hb';ldb.id='loadBtn';ldb.textContent='📂 讀檔';
 lb.textContent='📜 回顧';p.append(sb,ldb,lb,bb);
 m.onclick=e=>{e.stopPropagation();sb.style.display=started?'':'none';p.style.display=p.style.display==='flex'?'none':'flex'};
 p.addEventListener('click',e=>{e.stopPropagation();setTimeout(()=>p.style.display='none',0)});
 sb.onclick=()=>openSv('save');ldb.onclick=()=>openSv('load')})();
/* title */
const tl=$('#tbtns'),cb=document.createElement('button'),lb2=document.createElement('button');
cb.className='btn red';cb.id='contBtn';cb.textContent='▶ 繼續遊戲';lb2.className='btn';lb2.id='titleLoadBtn';lb2.textContent='📂 讀取進度';
[cb,lb2].forEach(b=>{b.style.flex='none';b.style.width='60%';b.style.marginBottom='10px'});tl.insertBefore(lb2,$('#startBtn'));tl.insertBefore(cb,lb2);
function refreshTitle(){$('#menuBtn').style.display=started?'':'none';const h=!!latest();cb.style.display=lb2.style.display=h?'':'none';$('#startBtn').textContent=h?'新遊戲':START_TXT;$('#startBtn').className=h?'btn':'btn red'}
const START_TXT=$('#startBtn').textContent;
cb.onclick=()=>{const d=latest();if(d)doLoad(d)};lb2.onclick=()=>openSv('load');
$('#startBtn').onclick=async()=>{if(latest()&&!(await ask('開始新遊戲？<br>（存檔不會被刪除，但自動存檔會被覆蓋）')))return;started=true;$('#menuBtn').style.display='';ac();rsize();await intro();renderScene()};
const _rs=renderScene;renderScene=function(){_rs();snapshot()};
refreshTitle();
(()=>{const p=LS.get(SKEY+'_pending');if(!p)return;LS.del(SKEY+'_pending');try{const d=JSON.parse(p);if(d&&d.v===SAVE_V&&SC[d.S.scene]){started=true;applySave(d)}}catch(e){}})();

rsize();setBg('street');
</script></body></html>
